[project]
name = "applied-ai-evals"
version = "0.1.0"
description = "Five applied-AI projects, each shipped with an answer key, baselines and a CI eval gate."
requires-python = ">=3.12"
dependencies = [
  "openai>=1.50",
  "opentelemetry-sdk>=1.27",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
docs = ["azure-ai-documentintelligence>=1.0", "pypdf>=5.0", "pillow>=10.0", "reportlab>=4.2"]
rag = ["numpy>=1.26", "rank-bm25>=0.2", "beautifulsoup4>=4.12", "requests>=2.32"]
agent = ["mcp>=1.2"]
aws = ["boto3>=1.35"]
dev = ["pytest>=8"]

[project.scripts]
evalgate = "evalgate.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["evalgate"]
